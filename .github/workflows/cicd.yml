
name: Banking System CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install G++
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Compile Banking System
        run: |
          g++ -std=c++17 -O2 CodeAlpha_Banking_Sysytem/banking_system.cpp -o banking_system

      - name: Set Docker Image Name
        run: |
          echo "IMAGE_NAME=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')/banking-system:latest" >> "$GITHUB_ENV"

      - name: Build Docker Image
        run: |
          docker build -t "$IMAGE_NAME" CodeAlpha_Banking_Sysytem

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_NAME"

  deploy:
    name: Test Docker Web Service
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Pull Docker Image
        run: |
          docker pull "${{ secrets.DOCKERHUB_USERNAME }}/banking-system:latest"

      - name: Run Web Service Container
        run: |
          docker run -d --name banking-test -p 10000:10000 -e PORT=10000 "${{ secrets.DOCKERHUB_USERNAME }}/banking-system:latest"

      - name: Test Web Service
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:10000/; then
              echo "Web service test successful"
              docker stop banking-test
              exit 0
            fi
            sleep 2
          done
          docker logs banking-test
          docker stop banking-test || true
          exit 1
