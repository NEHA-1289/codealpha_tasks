name: Banking System CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CodeAlpha_Banking_Sysytem

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Compile Banking System
      - name: Compile Banking System
        run: |
          g++ -std=c++17 -O2 banking_system.cpp -o banking_system

      # Step 3: Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/banking-system:latest .

      # Step 4: Check Docker Hub connection
      - name: Check Docker Hub connection
        run: |
          echo "Checking Docker Registry..."
          curl -sS -D - -o /dev/null https://registry-1.docker.io/v2/ | grep -Ei '^(HTTP/|www-authenticate:)'
          echo "Checking Docker Auth Service..."
          curl -sS -o /dev/null -w 'HTTP Status: %{http_code}\n' "https://auth.docker.io/token?service=registry.docker.io"

      # Step 5: Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # Step 6: Push Docker Image
      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/banking-system:latest
