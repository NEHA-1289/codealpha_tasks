
name: Banking System CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Banking System
        run: g++ -std=c++17 -O2 CodeAlpha_Banking_Sysytem/banking_system.cpp -o banking_system

      - name: Set lowercase Docker image name
        run: echo "IMAGE_NAME=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')/banking-system:latest" >> "$GITHUB_ENV"

      - name: Build Docker Image
        run: docker build -t "$IMAGE_NAME" CodeAlpha_Banking_Sysytem

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: docker push "$IMAGE_NAME"
